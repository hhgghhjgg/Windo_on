name: Linux Hermes Desktop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install Desktop
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xfce4 xvfb x11vnc novnc websockify g++ curl xz-utils git

      - name: 2. Start Desktop
        run: |
          nohup Xvfb :99 -screen 0 1280x800x24 > /tmp/xvfb.log 2>&1 &
          sleep 3
          DISPLAY=:99 nohup startxfce4 > /tmp/xfce.log 2>&1 &
          sleep 5
          nohup x11vnc -display :99 -forever -shared -passwd MyPass123 > /tmp/vnc.log 2>&1 &
          sleep 2
          nohup websockify --web /usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 2

      - name: 3. Public Tunnel
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:6080 > /tmp/cf.log 2>&1 &
          sleep 15
          echo "=================================================="
          echo "  >>> DESKTOP READY! <<<"
          grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/cf.log | head -1 | xargs -I {} echo "  Link: {}/vnc.html"
          echo "  Password: MyPass123"
          echo "=================================================="

      - name: 4. Keep Alive
        run: |
          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360] Running..."
          done
